            </figure>
            <figure class="gallery-card gallery-card--tall">
              <img src="assets/images/gallery-02.jpg" alt="Rhys Stermer in costume behind the scenes." width="757" height="1022" loading="lazy" decoding="async">
              <figcaption>Hänsel und Gretel</figcaption>
            </figure>
            <figure class="gallery-card gallery-card--landscape">
              <img src="assets/images/gallery-03.jpg" alt="Rhys Stermer as Alfred in Die Fledermaus." width="1600" height="1067" loading="lazy" decoding="async">
              <figcaption>Die Fledermaus</figcaption>
            </figure>
            <figure class="gallery-card gallery-card--portrait">

              <figcaption>Hänsel und Gretel</figcaption>
            </figure>
            <figure class="gallery-card gallery-card--square">
              <img src="assets/images/gallery-08.jpg" alt="Rhys Stermer singing in a recital with fellow performers." width="654" height="538" loading="lazy" decoding="async">
